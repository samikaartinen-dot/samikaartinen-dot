# ============================================================
#  Sami's Workshop – these are YOURS to edit (directly on GitHub is fine).
#  Everything else (commits, languages, weather, date) is fetched automatically.
# ============================================================

github_user: samikaartinen-dot
name: Sami Kaartinen
tagline: Teacher · Maker · Future AI developer

# Weather location (city name is shown in the image – keep it at city level)
city: Helsinki
latitude: 60.17
longitude: 24.94
timezone: Europe/Helsinki
show_clock: true          # false = hide the time of day from the image

# Language boxes on the shelf. Used when GitHub can't see your languages
# (your code repos are private, so this is the normal case for now).
languages:
  - { name: PY,  share: 50 }
  - { name: JS,  share: 25 }
  - { name: C++, share: 20 }
  - { name: SVG, share: 5 }

# "NOW BUILDING" sign on the wall + learning line
now_building: MANEK V2
learning: Python

# Project progress bars (update by hand – percentages are your own estimate)
projects:
  - { name: MANEK V2,       percent: 62 }
  - { name: Liigamanageri,  percent: 40 }
  - { name: Python MOOC,    percent: 35 }
  - { name: GitHub profile, percent: 80 }

# Project cards under the workshop (cards/<slug>.svg). Progress comes from "projects" above.
cards:
  - slug: manek
    title: MANEK V2
    art: manek
    project: MANEK V2
    line1: Screen-free coding game
    line2: command blocks + 8×8 LEDs
    tags: [ESP32, KiCad, laser]
    accent: "#39d353"
  - slug: liigamanageri
    title: Liigamanageri
    art: liiga
    project: Liigamanageri
    line1: Finnish ice hockey league
    line2: manager game in a browser
    tags: [JS, game, hockey]
    accent: "#3fa9ff"
  - slug: python
    title: Learning Python
    art: python
    project: Python MOOC
    line1: MOOC + a game that teaches
    line2: Python, built as I learn
    tags: [Python, MOOC, AI]
    accent: "#ffc940"

# Post-it notes on the monitor (max 3, max ~10 characters each) – only public stuff!
todos:
  - { text: KiCad PCB, color: "#ffd84a" }
  - { text: firmware,  color: "#ff8fb0" }
  - { text: README,    color: "#8ef0a8" }

# Trophy shelf (max 6). auto_commits = unlock automatically at N contributions this year
trophies:
  - { name: First repo,    unlocked: true }
  - { name: 100 commits,   auto_commits: 100 }
  - { name: Profile,       unlocked: true }
  - { name: MOOC Python,   unlocked: false }
  - { name: MANEK proto,   unlocked: false }
  - { name: First AI job,  unlocked: false }

# Wall calendar countdown. Leave label empty -> counts down to Christmas Eve.
countdown:
  label: ""               # e.g. "DEMO" (max ~8 chars)
  date: ""                # e.g. "2027-03-15"

# Split-flap second row rotates through these (max 8 characters each)
flap_words: [SAMI, MAKER, TEACHER, AI DEV]

# Liiga-style scoreboard (just for fun)
scoreboard: { home: CODE, home_score: 7, away: BUGS, away_score: 2 }

# Visitor counter (nixie tubes). source: komarev | none
visitors:
  source: komarev
